<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER Bed Monitoring System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        /* HEADER */
        .header {
            background: #123b5d;
            color: white;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .header-left h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header-left p {
            font-size: 13px;
            opacity: 0.85;
        }

        .time {
            text-align: right;
            font-size: 14px;
        }

        /* MAIN */
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 25px;
        }

        /* SUMMARY CARDS */
        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            border-left: 5px solid #123b5d;
        }

        .summary-card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .summary-number {
            font-size: 30px;
            font-weight: bold;
            color: #123b5d;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .controls h2 {
            font-size: 20px;
        }

        .search {
            padding: 11px 15px;
            width: 250px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        .search:focus {
            border-color: #123b5d;
        }

        /* SECTION */
        .section {
            background: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-header h3 {
            font-size: 18px;
            color: #123b5d;
        }

        .section-count {
            font-size: 13px;
            color: #64748b;
        }

        /* BED GRID */
        .bed-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        /* BED CARD */
        .bed {
            border: 2px solid #d1d5db;
            border-radius: 10px;
            padding: 18px;
            cursor: pointer;
            transition: 0.2s;
            background: #f8fafc;
            position: relative;
        }

        .bed:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.10);
        }

        .bed.available {
            border-color: #22c55e;
            background: #f0fdf4;
        }

        .bed.occupied {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .bed-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .available .status {
            background: #dcfce7;
            color: #15803d;
        }

        .occupied .status {
            background: #fee2e2;
            color: #b91c1c;
        }

        .click-note {
            margin-top: 12px;
            font-size: 11px;
            color: #64748b;
        }

        /* LEGEND */
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .legend-box {
            width: 13px;
            height: 13px;
            border-radius: 3px;
        }

        .green {
            background: #22c55e;
        }

        .red {
            background: #ef4444;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 12px;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .bed-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .time {
                text-align: left;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .bed-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <h1>ER Bed Monitoring System</h1>
            <p>Emergency Department Bed Availability Monitoring</p>
        </div>

        <div class="time">
            <div id="date"></div>
            <div id="clock"></div>
        </div>
    </header>


    <main class="container">

        <!-- SUMMARY -->
        <section class="summary">

            <div class="summary-card">
                <h3>Total Beds / Rooms</h3>
                <div class="summary-number" id="totalBeds">21</div>
            </div>

            <div class="summary-card">
                <h3>Available</h3>
                <div class="summary-number" id="availableBeds">21</div>
            </div>

            <div class="summary-card">
                <h3>Occupied</h3>
                <div class="summary-number" id="occupiedBeds">0</div>
            </div>

            <div class="summary-card">
                <h3>Occupancy Rate</h3>
                <div class="summary-number" id="occupancyRate">0%</div>
            </div>

        </section>


        <!-- CONTROLS -->
        <div class="controls">

            <h2>Bed Status</h2>

            <input
                type="text"
                class="search"
                id="search"
                placeholder="Search bed or room..."
            >

        </div>


        <!-- MEDICINE -->
        <section class="section">

            <div class="section-header">
                <h3>Medicine</h3>

                <span class="section-count" id="medicineCount">
                    9 beds
                </span>
            </div>

            <div class="bed-grid" id="medicineBeds"></div>

        </section>


        <!-- SURGERY -->
        <section class="section">

            <div class="section-header">
                <h3>Surgery</h3>

                <span class="section-count" id="surgeryCount">
                    4 beds
                </span>
            </div>

            <div class="bed-grid" id="surgeryBeds"></div>

        </section>


        <!-- PEDIATRIC -->
        <section class="section">

            <div class="section-header">
                <h3>Pediatric</h3>

                <span class="section-count" id="pediatricCount">
                    4 beds
                </span>
            </div>

            <div class="bed-grid" id="pediatricBeds"></div>

        </section>


        <!-- OBSERVATION -->
        <section class="section">

            <div class="section-header">
                <h3>Observation Room</h3>

                <span class="section-count" id="observationCount">
                    4 rooms
                </span>
            </div>

            <div class="bed-grid" id="observationBeds"></div>

        </section>


        <!-- LEGEND -->
        <div class="legend">

            <div class="legend-item">
                <span class="legend-box green"></span>
                Available
            </div>

            <div class="legend-item">
                <span class="legend-box red"></span>
                Occupied
            </div>

        </div>

    </main>


    <footer>
        ER Bed Monitoring System Prototype
    </footer>


    <script>

        /*
        ========================================
        BED DATA
        ========================================
        */

        const beds = {

            medicine: [
                "Medicine 01",
                "Medicine 02",
                "Medicine 03",
                "Medicine 04",
                "Medicine 05",
                "Medicine 06",
                "Medicine 07",
                "Medicine 08",
                "Medicine 09"
            ],

            surgery: [
                "Surgery 01",
                "Surgery 02",
                "Surgery 03",
                "Surgery 04"
            ],

            pediatric: [
                "Pediatric 01",
                "Pediatric 02",
                "Pediatric 03",
                "Pediatric 04"
            ],

            observation: [
                "Observation 01",
                "Observation 02",
                "Observation 03",
                "Observation 04"
            ]

        };


        /*
        ========================================
        BED STATUS
        ========================================
        */

        let status = {};

        Object.values(beds).flat().forEach(bed => {
            status[bed] = "available";
        });


        /*
        ========================================
        CREATE BED
        ========================================
        */

        function createBed(bedName) {

            const bed = document.createElement("div");

            bed.className = "bed " + status[bedName];

            bed.dataset.name = bedName.toLowerCase();

            bed.innerHTML = `
                <div class="bed-name">
                    ${bedName}
                </div>

                <span class="status">
                    ${status[bedName] === "available"
                        ? "AVAILABLE"
                        : "OCCUPIED"}
                </span>

                <div class="click-note">
                    Click to change status
                </div>
            `;

            /*
            CLICK TO CHANGE STATUS
            */

            bed.addEventListener("click", function() {

                if (status[bedName] === "available") {

                    status[bedName] = "occupied";

                } else {

                    status[bedName] = "available";

                }

                renderBeds();
                updateSummary();

            });

            return bed;
        }


        /*
        ========================================
        DISPLAY BEDS
        ========================================
        */

        function renderBeds() {

            const medicineContainer =
                document.getElementById("medicineBeds");

            const surgeryContainer =
                document.getElementById("surgeryBeds");

            const pediatricContainer =
                document.getElementById("pediatricBeds");

            const observationContainer =
                document.getElementById("observationBeds");


            medicineContainer.innerHTML = "";
            surgeryContainer.innerHTML = "";
            pediatricContainer.innerHTML = "";
            observationContainer.innerHTML = "";


            beds.medicine.forEach(bed => {

                medicineContainer.appendChild(
                    createBed(bed)
                );

            });


            beds.surgery.forEach(bed => {

                surgeryContainer.appendChild(
                    createBed(bed)
                );

            });


            beds.pediatric.forEach(bed => {

                pediatricContainer.appendChild(
                    createBed(bed)
                );

            });


            beds.observation.forEach(bed => {

                observationContainer.appendChild(
                    createBed(bed)
                );

            });


            applySearch();

        }


        /*
        ========================================
        SUMMARY
        ========================================
        */

        function updateSummary() {

            const allBeds = Object.values(beds).flat();

            const total = allBeds.length;

            const occupied =
                allBeds.filter(
                    bed => status[bed] === "occupied"
                ).length;

            const available = total - occupied;

            const occupancyRate =
                total === 0
                    ? 0
                    : Math.round((occupied / total) * 100);


            document.getElementById("totalBeds")
                .textContent = total;

            document.getElementById("availableBeds")
                .textContent = available;

            document.getElementById("occupiedBeds")
                .textContent = occupied;

            document.getElementById("occupancyRate")
                .textContent = occupancyRate + "%";


            updateSectionCounts();
        }


        /*
        ========================================
        SECTION COUNTS
        ========================================
        */

        function updateSectionCounts() {

            updateCount(
                beds.medicine,
                "medicineCount",
                "beds"
            );

            updateCount(
                beds.surgery,
                "surgeryCount",
                "beds"
            );

            updateCount(
                beds.pediatric,
                "pediatricCount",
                "beds"
            );

            updateCount(
                beds.observation,
                "observationCount",
                "rooms"
            );

        }


        function updateCount(list, elementID, label) {

            const occupied =
                list.filter(
                    bed => status[bed] === "occupied"
                ).length;

            const available =
                list.length - occupied;

            document.getElementById(elementID)
                .textContent =
                `${available} available / ${occupied} occupied`;

        }


        /*
        ========================================
        SEARCH
        ========================================
        */

        document.getElementById("search")
            .addEventListener("input", applySearch);


        function applySearch() {

            const query =
                document.getElementById("search")
                    .value
                    .toLowerCase();


            document.querySelectorAll(".bed")
                .forEach(bed => {

                    const name =
                        bed.dataset.name;

                    if (name.includes(query)) {

                        bed.style.display = "";

                    } else {

                        bed.style.display = "none";

                    }

                });

        }


        /*
        ========================================
        DATE AND TIME
        ========================================
        */

        function updateClock() {

            const now = new Date();

            const date =
                now.toLocaleDateString(
                    "en-PH",
                    {
                        weekday: "long",
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    }
                );

            const time =
                now.toLocaleTimeString(
                    "en-PH"
                );


            document.getElementById("date")
                .textContent = date;

            document.getElementById("clock")
                .textContent = time;

        }


        /*
        ========================================
        INITIALIZE
        ========================================
        */

        renderBeds();

        updateSummary();

        updateClock();

        setInterval(updateClock, 1000);

    </script>

</body>
</html>
